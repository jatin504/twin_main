- id: PV1
  bus: PV_BUS
  feeder: PV_FEEDER
  template: PV2000
filters:
- id: HF1
  bus: BUS_690_A
protection:
- breaker: GRID_INCOMER
  relay: ANSI50_51
- breaker: PCS_FEEDER_1
